<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2b5a3c"/>
      <stop offset="1" stop-color="#10231a"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg)"/>
  <g transform="translate(20 12) scale(0.86)">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#6fdc7c"/>
      <stop offset="0.55" stop-color="#34b24a"/>
      <stop offset="1" stop-color="#1f7f35"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be89a"/>
      <stop offset="1" stop-color="#4cc25a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9a40"/>
      <stop offset="1" stop-color="#176b2b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="1" stop-color="#2459d6"/>
